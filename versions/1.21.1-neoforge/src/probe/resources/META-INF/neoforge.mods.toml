modLoader="javafml"
loaderVersion="[4,5)"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}_probe"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_homepage}"
logoFile="assets/radiance_probe/icon.png"
authors="${mod_authors}"
description="${mod_description}"

[[mixins]]
config="radiance-audit.mixins.json"

[[dependencies.${mod_id}_probe]]
modId="neoforge"
type="required"
versionRange="[${loader_minimum},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}_probe]]
modId="${mod_id}"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
