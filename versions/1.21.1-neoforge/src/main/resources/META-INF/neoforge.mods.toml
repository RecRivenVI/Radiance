modLoader="javafml"
loaderVersion="[4,5)"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_homepage}"
logoFile="${mod_logo}"
authors="${mod_authors}"
description="${mod_description}"

[[mixins]]
config="radiance.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${loader_minimum},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="CLIENT"

# Temporary exact compatibility pins for the current parent-mod distributions.
# Missing mods are allowed; installed versions must match. Libraries without a mod ID are excluded.
[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[${create_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="flywheel"
type="optional"
versionRange="[${flywheel_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ponder"
type="optional"
versionRange="[${ponder_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sable"
type="optional"
versionRange="[${sable_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="sablecompanion"
type="optional"
versionRange="[${sablecompanion_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="veil"
type="optional"
versionRange="[${veil_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="aeronautics_bundled"
type="optional"
versionRange="[${aeronautics_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="aeronautics"
type="optional"
versionRange="[${aeronautics_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="simulated"
type="optional"
versionRange="[${aeronautics_metadata_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="offroad"
type="optional"
versionRange="[${aeronautics_metadata_version}]"
ordering="NONE"
side="CLIENT"
