[versions]
foojay = "1.0.0"
google-java-format = "1.36.1"
junit = "6.1.3"
ktfmt = "0.65"
loom = "1.18.3"
moddev = "2.0.148"
python = "3.12.10"
rumdl = "0.2.78"
spotless = "8.10.4"
tomlj = "2.2.0"
vulkan-sdk = "1.4.341.1"

snakeyaml = "2.6"
asm = "9.10.1"
gson = "2.13.2"

[libraries]
foojay-plugin = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
loom-plugin = { module = "net.fabricmc:fabric-loom", version.ref = "loom" }
moddev-plugin = { module = "net.neoforged:moddev-gradle", version.ref = "moddev" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }

snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
